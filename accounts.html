<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP · 계정 연결</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="accounts">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>계정 연결</h1>
        <p class="crumb" id="whoami">내 LLM 계정을 등록합니다. 등록한 키는 나만 열 수 있습니다.</p>
      </div>
    </header>

    <section class="sec">
      <div class="notice notice-safe">
        <strong>🔐 키는 내 비밀번호로 암호화되어 저장됩니다</strong>
        <p>
          저장소에는 암호문만 남고, 화면에는 마지막 4자리만 표시됩니다.
          <b>다른 직원이 자기 계정으로 로그인해도 내 키는 복호화할 수 없습니다.</b>
          비밀번호를 잊으면 키도 복구할 수 없으니 다시 발급받아 등록해야 합니다.
        </p>
      </div>

      <div class="account-grid" id="accountGrid"></div>

      <div class="panel" id="adminPanel" hidden>
        <div class="panel-head">
          <h2>직원 목록 <span class="badge ok">관리자</span></h2>
          <span class="muted">이름과 연결 여부만 보입니다 — 키는 볼 수 없습니다</span>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>이름</th><th>아이디</th><th>권한</th><th>등록일</th></tr></thead>
            <tbody id="userBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/accounts.js"></script>
</body>
</html>
